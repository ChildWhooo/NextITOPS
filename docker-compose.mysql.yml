services:
  mysql:
    image: mysql:8.4
    container_name: nexaops-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: nexaops
      MYSQL_USER: nexaops
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-this-root-password}
      TZ: Asia/Shanghai
    volumes:
      - nexaops_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-unexaops", "-p${DB_PASSWORD:-change-this-db-password}"]
      interval: 5s
      timeout: 5s
      retries: 15

  nexaops:
    build: .
    container_name: nexaops-itsm
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_CLIENT: mysql2
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexaops
      DB_USER: nexaops
      DB_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      AUTO_SEED: "true"
      TZ: Asia/Shanghai

volumes:
  nexaops_mysqldata:
