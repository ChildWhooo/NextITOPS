services:
  postgres:
    image: postgres:16-alpine
    container_name: nexaops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexaops
      POSTGRES_USER: nexaops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      TZ: Asia/Shanghai
    volumes:
      - nexaops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaops -d nexaops"]
      interval: 5s
      timeout: 5s
      retries: 10

  nexaops:
    build: .
    container_name: nexaops-itsm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_CLIENT: pg
      DATABASE_URL: postgres://nexaops:${DB_PASSWORD:-change-this-db-password}@postgres:5432/nexaops
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      AUTO_SEED: "true"
      TZ: Asia/Shanghai

volumes:
  nexaops_pgdata:
